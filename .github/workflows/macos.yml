name: Secure macOS VDS

on:
  workflow_dispatch:

jobs:
  launch-mac:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup tmate session
        id: tmate
        uses: mxschmitt/action-tmate@v3
        with:
          detached: true

      - name: Send Private Notification
        env:
          TOPIC: ${{ secrets.NTFY_TOPIC }}
          WEB_URL: ${{ steps.tmate.outputs.web-url }}
          SSH_CMD: ${{ steps.tmate.outputs.ssh-command }}
        run: |
          curl -s \
            -H "Title: macOS VDS Hazir" \
            -H "Priority: urgent" \
            -H "Tags: desktop_computer,key" \
            -d "WEB: $WEB_URL | SSH: $SSH_CMD" \
            "https://ntfy.sh/${TOPIC}"
