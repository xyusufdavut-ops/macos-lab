name: Google Desktop macOS

on:
  workflow_dispatch:
    inputs:
      crd_code:
        description: 'Google Headless Kodu'
        required: true
      pin:
        description: '6 Haneli PIN'
        required: true
        default: '123456'

jobs:
  launch-desktop:
    runs-on: macos-latest
    timeout-minutes: 360 # 6 saat

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Chrome Remote Desktop Host
        run: |
          echo "[*] Google Host motoru indiriliyor..."
          curl -sL https://dl.google.com/chrome-remote-desktop/chromeremotedesktop.dmg -o crd.dmg
          sudo hdiutil attach crd.dmg
          sudo installer -pkg "/Volumes/Chrome Remote Desktop Host/Chrome Remote Desktop Host.pkg" -target /
          sudo hdiutil detach "/Volumes/Chrome Remote Desktop Host"
          rm -f crd.dmg

      - name: Authorize and Start Google Desktop
        run: |
          echo "[*] Google yetkilendirmesi baslatiliyor..."
          ${{ github.event.inputs.crd_code }} --pin=${{ github.event.inputs.pin }}

      - name: Keep Alive Loop
        run: |
          echo "[*] macOS Masaustu aktif tutuluyor..."
          while true; do
            sleep 60
            echo "[$(date '+%H:%M:%S')] macOS canli..."
          done
